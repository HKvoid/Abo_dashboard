services:
  - type: web
    name: abo-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard:app -c gunicorn_config.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
